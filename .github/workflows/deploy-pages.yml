name: Deploy Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'value.html'
      - 'valueNEW.html'
      - 'racefinder.html'
      - 'race_lab.html'
      - 'index.html'
      - 'AtoZ.html'
      - '2026-*.html'
      - '*.json'
      - '*.csv'
      - 'extra_places.txt'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'images/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_3.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment_attempt_1.outputs.page_url }}

    steps:
      - name: Settle rapid model pushes
        run: |
          echo "Waiting 90 seconds so rapid model file commits can finish..."
          sleep 90

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          echo "Copying live racing visualizer files..."

          cp -f value.html _site/ 2>/dev/null || true
          cp -f valueNEW.html _site/ 2>/dev/null || true
          cp -f racefinder.html _site/ 2>/dev/null || true
          cp -f race_lab.html _site/ 2>/dev/null || true
          cp -f index.html _site/ 2>/dev/null || true
          cp -f AtoZ.html _site/ 2>/dev/null || true
          cp -f extra_places.txt _site/ 2>/dev/null || true

          cp -f 2026-*.html _site/ 2>/dev/null || true

          cp -f *.json _site/ 2>/dev/null || true
          cp -f *.csv _site/ 2>/dev/null || true

          cp -rf css _site/css 2>/dev/null || true
          cp -rf js _site/js 2>/dev/null || true
          cp -rf assets _site/assets 2>/dev/null || true
          cp -rf images _site/images 2>/dev/null || true
          cp -rf docs _site/docs 2>/dev/null || true

          touch _site/.nojekyll

          echo "Site artifact contents, first 120 files:"
          find _site -maxdepth 2 -type f | sort | sed -n '1,120p'

          echo "Checking required pages were included:"
          test -f _site/index.html
          test -f _site/value.html
          test -f _site/valueNEW.html
          test -f _site/racefinder.html
          test -f _site/race_lab.html

          ls -lh _site/index.html
          ls -lh _site/value.html
          ls -lh _site/valueNEW.html
          ls -lh _site/racefinder.html
          ls -lh _site/race_lab.html

          echo "Checking Race Finder data:"
          test -f _site/race_finder_data.json
          ls -lh _site/race_finder_data.json

          echo "Checking Pace and Scenario Lab data:"
          test -f _site/race_simulation_insights.json
          ls -lh _site/race_simulation_insights.json

          echo "HTML count:"
          find _site -name "*.html" | wc -l

          echo "JSON count:"
          find _site -name "*.json" | wc -l

          echo "CSV count:"
          find _site -name "*.csv" | wc -l

          echo "Total artifact size:"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages attempt 1
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          timeout: 600000

      - name: Wait before retry 2
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: |
          echo "GitHub Pages deploy failed on attempt 1."
          echo "Waiting 60 seconds before retry..."
          sleep 60

      - name: Deploy to GitHub Pages attempt 2
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          timeout: 600000

      - name: Wait before retry 3
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        run: |
          echo "GitHub Pages deploy failed on attempt 2."
          echo "Waiting 120 seconds before retry..."
          sleep 120

      - name: Deploy to GitHub Pages attempt 3
        id: deployment_attempt_3
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          timeout: 600000

      - name: Deployment summary
        if: always()
        run: |
          echo "Attempt 1: ${{ steps.deployment_attempt_1.outcome }}"
          echo "Attempt 2: ${{ steps.deployment_attempt_2.outcome }}"
          echo "Attempt 3: ${{ steps.deployment_attempt_3.outcome }}"
